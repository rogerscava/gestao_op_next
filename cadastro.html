    function sha256(str){
      const bytes = unescape(encodeURIComponent(str));
      function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
      const mp=Math.pow, maxW=mp(2,32); let h=[],k=[],pc=0,comp={};
      for(let c=2;pc<64;c++){ if(!comp[c]){ for(let i=0;i<313;i+=c) comp[i]=c; h[pc]=(mp(c,.5)*maxW)|0; k[pc++]=(mp(c,1/3)*maxW)|0; } }
      let asc=bytes+'\x80'; while(asc.length%64-56) asc+='\x00';
      const words=[]; const bitLen=bytes.length*8;
      for(let i=0;i<asc.length;i++){ const j=asc.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
      words[words.length]=(bitLen/maxW)|0; words[words.length]=bitLen;
      for(let j=0;j<words.length;){
        const w=words.slice(j,j+=16); const old=h; h=h.slice(0,8);
        for(let i=0;i<64;i++){
          const w15=w[i-15],w2=w[i-2],a=h[0],e=h[4];
          const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]
            +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
          const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
          h=[(t1+t2)|0].concat(h); h[4]=(h[4]+t1)|0;
        }
        for(let i=0;i<8;i++) h[i]=(h[i]+old[i])|0;
      }
      let out=''; for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(h[i]>>(j*8))&255; out+=((b<16)?'0':'')+b.toString(16); }
      return out;
    }

      const badgeDesenho = (tipo, item) => {

        const editando = editDes && editDes.tipo===tipo && editDes.id===id;
        if (editando) return (

        );
        return (
          <button onClick={(e)=>{ e.stopPropagation(); setEditDes({tipo,id}); setEditDesVal(des||''); }}
            className={`text-[10px] font-mono px-2 py-0.5 rounded border shrink-0 ${des?'bg-gray-800 border-gray-700 text-gray-300':'border-dashed border-gray-700 text-gray-500 hover:text-gray-300'}`}>
            {des ? `⧉ ${des}` : '+ desenho'}
          </button>
        );
      };

      // editar NOME de um item (função que RETORNA JSX — não é componente, não remonta)
      const salvarNome = (tipo, id, valor) => {
        const nome = valor.trim(); if(!nome){ setEditNome(null); return toast('Nome não pode ficar vazio.','erro'); }
        const cfg = { cliente:[clientes,setClientes,'clientes'], maquina:[maquinas,setMaquinas,'maquinas'], conjunto:[conjuntos,setConjuntos,'conjuntos'], subconjunto:[subconjuntos,setSubconjuntos,'subconjuntos'] }[tipo];
        const [lista,setLista,docId] = cfg;
        const n = lista.map(x => idDe(x)===id ? { ...(typeof x==='string'?{nome:x}:x), id:idDe(x), nome } : x);
        setLista(n); salvarParametro(docId, n); setEditNome(null); setEditNomeVal(''); toast('Nome atualizado.');
      };
      const nomeEditavel = (tipo, item) => {
        const id = idDe(item);
        const editando = editNome && editNome.tipo===tipo && editNome.id===id;
        if (editando) return (
          <input autoFocus value={editNomeVal} onClick={e=>e.stopPropagation()} onChange={e=>setEditNomeVal(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter') salvarNome(tipo,id,editNomeVal); if(e.key==='Escape'){setEditNome(null);setEditNomeVal('');} }}
            onBlur={()=>salvarNome(tipo,id,editNomeVal)}
            className="flex-1 min-w-0 bg-gray-950 border border-blue-500 rounded px-2 py-1 text-sm text-white"/>
        );
        return (<>
          <span className="flex-1 font-semibold text-white truncate">{nomeDe(item)}</span>
          <button onClick={(e)=>{ e.stopPropagation(); setEditNome({tipo,id}); setEditNomeVal(nomeDe(item)); }} className="text-gray-600 hover:text-blue-400 opacity-0 group-hover:opacity-100 shrink-0 text-xs" title="Editar nome">✏️</button>
        </>);
      };
      const delParametro = (lista, setLista, docId, item, campoOP, filhos) => {
        const nome = nomeDe(item); const emUso = usoAtivo(nome, campoOP);
        if(emUso > 0) return toast(`"${nome}" está em ${emUso} OP(s) ativa(s). Conclua/cancele antes.`, 'erro');
        if(filhos > 0) return toast(`"${nome}" tem ${filhos} item(ns) vinculado(s). Apague-os primeiro.`, 'erro');
        setConfirmar({ titulo:'Excluir', msg:`Remover "${nome}" do cadastro?`, onOk:()=>{ const n=lista.filter(x=>x!==item); setLista(n); salvarParametro(docId, n); toast('Removido.'); } });
      };

      // ===== OPERADORES =====
      const resetOperador = () => { setEditandoUser(null); setOpuLogin(''); setOpuSenha(''); setOpuPerms(permsVazio()); };
      const editarOperador = (u) => { setEditandoUser(u.login); setOpuLogin(u.login); setOpuSenha(''); setOpuPerms(u.permissoes ? {...permsVazio(), ...u.permissoes} : permsCheias()); window.scrollTo({top:0,behavior:'smooth'}); };
      const togglePerm = (k) => setOpuPerms(p=>({ ...p, [k]:!p[k] }));
      const aplicarPreset = (nome) => { const o=permsVazio(); PRESETS[nome].forEach(k=>o[k]=true); setOpuPerms(o); };
      const salvarOperador = () => {
        const login = opuLogin.toLowerCase().trim();
        if(!login) return toast('Informe o login.','erro');
        const perms = {}; TODAS_FUNCOES.forEach(k=>perms[k]=!!opuPerms[k]);
        if(!Object.values(perms).some(Boolean)) return toast('Marque ao menos uma permissão.','erro');
        const ref = db.collection('usuarios').doc(login);
        if(editandoUser){ const upd={login,permissoes:perms}; if(opuSenha.trim()) upd.senha=sha256(opuSenha); ref.set(upd,{merge:true}); toast('Operador atualizado.'); }
        else { if(usuarios.some(u=>u.login===login)) return toast('Já existe operador com esse login.','erro'); if(!opuSenha.trim()) return toast('Defina uma senha.','erro'); ref.set({login,senha:sha256(opuSenha),permissoes:perms}); toast('Operador cadastrado.'); }
        resetOperador();
      };
      const deletarUsuario = (id) => { if(id===usuarioLogado) return toast('Você não pode excluir a si mesmo.','erro'); setConfirmar({ titulo:'Excluir operador', msg:`Remover @${id}?`, onOk:()=>{ db.collection('usuarios').doc(id).delete(); toast('Operador removido.'); } }); };

      // ===== BACKUP + ZERAR DADOS (ADM) =====
      const baixarBackup = (prefixo='backup') => {
        const dump = { exportadoEm:new Date().toISOString(), ordens, clientes, maquinas, conjuntos, subconjuntos, usuarios };
        const blob = new Blob([JSON.stringify(dump,null,2)], { type:'application/json' });
        const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${prefixo}-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(a.href);
      };
      const zerarDados = () => {
        if(!podeAcessar('operadores')) return;
        setConfirmar({
          titulo:'🧨 ZERAR TODOS OS DADOS',
          msg:'Isto APAGA todas as OPs e todo o cadastro de estrutura (clientes, máquinas, conjuntos, subconjuntos). Operadores e senhas são MANTIDOS. Um backup .json será baixado antes. Digite ZERAR para confirmar:',
          exigir:'ZERAR',
          onOk: async () => {
            try {
              baixarBackup('backup-antes-de-zerar');
              const ids = ordens.map(o=>o.docId);
              for (let i=0;i<ids.length;i+=450){
                const batch = db.batch();
                ids.slice(i,i+450).forEach(id=>batch.delete(db.collection('ordens').doc(id)));
                await batch.commit();
              }
              await Promise.all(['clientes','maquinas','conjuntos','subconjuntos'].map(p=>db.collection('parametros').doc(p).set({ lista:[] })));
              toast('Sistema zerado. Operadores mantidos.');
            } catch(e){ toast('Erro ao zerar: '+e.message, 'erro'); }
          }
        });
      };

      // ===== OP (form) =====
      const handleCheckboxSetor = (setor) => { if (roteiroSelecionado.includes(setor)) setRoteiroSelecionado(roteiroSelecionado.filter(x=>x!==setor)); else setRoteiroSelecionado(ordenarRoteiro([...roteiroSelecionado, setor])); };
      const proximoCodigo = () => { let max=0; ordens.forEach(o=>{ const m=String(o.id).match(/\d+/g); if(m){ const n=parseInt(m[m.length-1],10); if(n>max) max=n; } }); return 'OP - ' + String(max+1).padStart(3,'0'); };
      const resetForm = () => { setEditandoId(null); setOpIniciada(false); setOpId(proximoCodigo()); setOpNotaFiscal(''); setOpClienteRef(''); setOpMaquinaRef(''); setOpConjuntoRef(''); setOpSubconjuntoRef(''); setOpTotal(''); setOpData(''); setRoteiroSelecionado([]); };
      useEffect(()=>{ if(!editandoId && !opId) setOpId(proximoCodigo()); }, [ordens]);

      const editarOP = (op) => {
        setEditandoId(op.docId); setOpIniciada(opStarted(op));
        setOpId(op.id); setOpNotaFiscal(op.notaFiscal==='-'?'':op.notaFiscal);
        const cli = clientes.find(c=>nomeDe(c)===op.cliente);
        const maq = maquinas.find(m=>nomeDe(m)===op.maquina && (!cli || refCli(m)===idDe(cli)));
        const cj  = conjuntos.find(c=>nomeDe(c)===op.conjunto && (!maq || refMaq(c)===idDe(maq)));
        const sb  = subconjuntos.find(s=>nomeDe(s)===op.subconjunto && (!cj || refCj(s)===idDe(cj)));
        setOpClienteRef(cli?idDe(cli):''); setOpMaquinaRef(maq?idDe(maq):''); setOpConjuntoRef(cj?idDe(cj):''); setOpSubconjuntoRef(sb?idDe(sb):'');
        setOpTotal(op.total); setOpData(op.dataEntrega); setRoteiroSelecionado(ordenarRoteiro(op.roteiro||[]));
        window.scrollTo({ top:0, behavior:'smooth' });
      };
      const excluirOP = (op) => {
        if (opStarted(op)) setConfirmar({ titulo:'⚠️ Excluir OP em produção', msg:`A OP ${op.id} já tem apontamentos (tempo/refugo) que serão PERDIDOS. Para confirmar, digite o código:`, exigir:op.id, onOk:()=>{ db.collection('ordens').doc(op.docId).delete(); toast('OP excluída.'); } });
        else setConfirmar({ titulo:'Excluir OP', msg:`Remover a OP ${op.id}? Ela ainda não iniciou.`, onOk:()=>{ db.collection('ordens').doc(op.docId).delete(); toast('OP excluída.'); } });
      };
      const cancelarOP = (op) => setConfirmar({ titulo:'🚫 Cancelar OP', msg:`Cancelar a OP ${op.id}? Ela sai da produção mas FICA no histórico.`, onOk:()=>{ db.collection('ordens').doc(op.docId).update({ cancelada:true, canceladaEm:new Date().toISOString(), canceladaPor:usuarioLogado }); toast('OP cancelada.'); } });

      const salvarOP = (e) => {
        e.preventDefault();
        const codigo = opId.toUpperCase().trim();
        if(!codigo || codigo==='OP -' || !opTotal || !opData) return toast('Preencha código, total e data.', 'erro');
        if(Number(opTotal) <= 0) return toast('Total de peças deve ser maior que zero.', 'erro');
        if(!editandoId && roteiroSelecionado.length===0) return toast('Selecione ao menos um setor no roteiro.', 'erro');
        if(opData < new Date().toISOString().slice(0,10)) toast('Atenção: data de entrega no passado.', 'aviso');
        const cliNome = nomeDe(clientes.find(c=>idDe(c)===opClienteRef)) || '-';
        const maqNome = nomeDe(maquinas.find(m=>idDe(m)===opMaquinaRef)) || '-';
        const cjNome  = nomeDe(conjuntos.find(c=>idDe(c)===opConjuntoRef)) || '-';
        const sbNome  = nomeDe(subconjuntos.find(s=>idDe(s)===opSubconjuntoRef)) || '-';
        const base = { id:codigo, notaFiscal:opNotaFiscal||'-', cliente:cliNome, maquina:maqNome, conjunto:cjNome, subconjunto:sbNome, total:Number(opTotal), dataEntrega:opData };
        if (editandoId) {
          const upd = { ...base };
          if (!opIniciada) { const roteiro = ordenarRoteiro(roteiroSelecionado); upd.roteiro = roteiro; upd.etapaAtual = 0; upd.historicoTempos = { [roteiro[0]]: { inicio:new Date().toISOString(), fim:null } }; }
          db.collection('ordens').doc(editandoId).update(upd); toast('OP modificada.');
        } else {
          if(ordens.some(o=>o.id===codigo)) return toast('Código de OP duplicado!', 'erro');
          const roteiro = ordenarRoteiro(roteiroSelecionado);
          db.collection('ordens').doc(codigo).set({ ...base, roteiro, feitas:0, etapaAtual:0, criadoPor:usuarioLogado, criadoEm:new Date().toISOString(), historicoTempos:{ [roteiro[0]]:{ inicio:new Date().toISOString(), fim:null } } });
          toast('OP liberada para produção.');
        }
        resetForm();
      };

      const maquinasFiltradas = maquinas.filter(m=>refCli(m)===opClienteRef);
      const conjuntosFiltrados = conjuntos.filter(c=>refMaq(c)===opMaquinaRef);
      const subconjuntosFiltrados = subconjuntos.filter(s=>refCj(s)===opConjuntoRef);
      const bA = busca.trim().toLowerCase();
      const opsFiltradas = ordensAtivas.filter(o => !bA || `${o.id} ${o.cliente}`.toLowerCase().includes(bA));
      const bloqueado = editandoId && opIniciada;
      const inp = "w-full bg-gray-900 p-2 text-sm rounded border border-gray-700 focus:border-blue-500 focus:outline-none";
      const podeExcluir = podeAcessar('opsExcluir');

      // abas disponíveis conforme permissão
      const abas = [];
      if(podeAcessar('ops')) abas.push({id:'ordens', label:'📦 Ordens de Produção'});
      if(podeAcessar('estrutura')) abas.push({id:'estrutura', label:'🏗️ Estrutura'});
      if(podeAcessar('operadores')) abas.push({id:'operadores', label:'👥 Operadores'});
      const abaAtual = abas.some(a=>a.id===aba) ? aba : (abas[0]?.id || null);

      // drill-down data
      const maqsDrill = maquinas.filter(m=>refCli(m)===selCli);
      const conjsDrill = conjuntos.filter(c=>refMaq(c)===selMaq);
      const subsDrill = subconjuntos.filter(s=>refCj(s)===selConj);
      const clientesFiltrados = clientes.filter(c=>!buscaCli.trim() || nomeDe(c).toLowerCase().includes(buscaCli.trim().toLowerCase()));

      if (!usuarioLogado) return null;

      const ItemLista = ({sel,onSel,onDel,children}) => (
        <div onClick={onSel} className={`px-2.5 py-2 rounded-lg flex justify-between items-center cursor-pointer text-sm ${sel?'bg-blue-600 text-white':'bg-gray-950 hover:bg-gray-800'}`}>
          <span className="truncate">{children}</span>
          <button onClick={(e)=>{e.stopPropagation(); onDel();}} className="text-red-400 hover:text-red-200 ml-2 shrink-0 font-bold">✕</button>
        </div>
      );

      return (
        <div className="max-w-7xl mx-auto pb-24">
          <Header active="cadastros" user={usuarioLogado}/>

          {/* ABAS */}
          <div className="flex gap-2 mb-5 flex-wrap">
            {abas.map(a=>(
              <button key={a.id} onClick={()=>setAba(a.id)} className={`px-4 py-2 text-sm font-bold rounded-lg ${abaAtual===a.id?'bg-blue-600 text-white':'bg-gray-800 text-gray-400 hover:text-white'}`}>{a.label}</button>
            ))}
          </div>

          {/* ================= ABA ORDENS ================= */}
          {abaAtual==='ordens' && (<div>
            <div className={`p-6 rounded-2xl border shadow-xl mb-6 ${editandoId?'bg-blue-950/40 border-blue-700':'bg-gray-800 border-gray-700'}`}>
              <div className="flex justify-between items-center mb-4">
                <h2 className={`text-xl font-black ${editandoId?'text-blue-300':'text-green-400'}`}>{editandoId?`✏️ Editando ${opId}`:'🟢 Nova Ordem de Produção'}</h2>
                {editandoId && <button onClick={resetForm} className="text-xs bg-gray-700 px-3 py-1.5 rounded font-bold">Cancelar edição</button>}
              </div>
              {bloqueado && <div className="mb-4 text-xs bg-amber-900/40 border border-amber-700 text-amber-300 px-3 py-2 rounded-lg font-bold">🔒 OP já em produção — código e roteiro travados. Você ainda pode ajustar NF, prazo e total.</div>}
              <form onSubmit={salvarOP} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div><label className="text-xs text-gray-400 font-bold">Código</label><input required className={`${inp} font-mono text-yellow-400`} value={opId} onChange={e=>{const v=e.target.value; if(v.startsWith('OP - ')||v.startsWith('OP -')||v==='OP '||v==='OP')setOpId(v)}} disabled={!!editandoId}/></div>
                <div><label className="text-xs text-gray-400 font-bold">Nota Fiscal</label><input placeholder="Opcional" className={inp} value={opNotaFiscal} onChange={e=>setOpNotaFiscal(e.target.value)}/></div>
                <div><label className="text-xs text-gray-400 font-bold">Cliente</label><select disabled={bloqueado} className={`${inp} disabled:opacity-50`} value={opClienteRef} onChange={e=>{setOpClienteRef(e.target.value);setOpMaquinaRef('');setOpConjuntoRef('');setOpSubconjuntoRef('');}}><option value="">Selecione</option>{clientes.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select></div>
                <div><label className="text-xs text-gray-400 font-bold">Máquina</label><select disabled={bloqueado} className={`${inp} disabled:opacity-50`} value={opMaquinaRef} onChange={e=>{setOpMaquinaRef(e.target.value);setOpConjuntoRef('');setOpSubconjuntoRef('');}}><option value="">Selecione</option>{maquinasFiltradas.map(m=><option key={idDe(m)} value={idDe(m)}>{nomeDe(m)}</option>)}</select></div>
                <div><label className="text-xs text-gray-400 font-bold">Conjunto</label><select disabled={bloqueado} className={`${inp} disabled:opacity-50`} value={opConjuntoRef} onChange={e=>{setOpConjuntoRef(e.target.value);setOpSubconjuntoRef('');}}><option value="">Selecione</option>{conjuntosFiltrados.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select></div>
                <div><label className="text-xs text-gray-400 font-bold">Subconjunto</label><select disabled={bloqueado} className={`${inp} disabled:opacity-50`} value={opSubconjuntoRef} onChange={e=>setOpSubconjuntoRef(e.target.value)}><option value="">Selecione</option>{subconjuntosFiltrados.map(s=><option key={idDe(s)} value={idDe(s)}>{nomeDe(s)}</option>)}</select></div>
                <div><label className="text-xs text-gray-400 font-bold">Total Peças</label><input required type="number" min="1" className={inp} value={opTotal} onChange={e=>setOpTotal(e.target.value)}/></div>
                <div><label className="text-xs text-gray-400 font-bold">Data Entrega</label><input required type="date" className={inp} value={opData} onChange={e=>setOpData(e.target.value)}/></div>
                <div className="col-span-1 md:col-span-4 border-t border-gray-700 pt-3">
                  <label className="block text-sm font-bold text-yellow-400 mb-2">Roteiro (marque os setores — a ordem é automática):</label>
                  <div className={`flex flex-wrap gap-4 bg-gray-950 p-3 rounded mb-2 border border-gray-700 ${bloqueado?'opacity-50 pointer-events-none':''}`}>
                    {ORDEM_SETORES.map(setor=>(<label key={setor} className="flex items-center gap-1.5 cursor-pointer text-sm"><input type="checkbox" checked={roteiroSelecionado.includes(setor)} onChange={()=>handleCheckboxSetor(setor)} className="w-4 h-4"/><span>{setor}</span></label>))}
                  </div>
                  <div className="text-xs text-gray-400">Sequência: <span className="font-bold text-white">{roteiroSelecionado.map((s,i)=>`${i+1}º ${s}`).join(' ➔ ')||'nenhum setor'}</span></div>
                </div>
                <div className="col-span-1 md:col-span-4"><button type="submit" className={`w-full font-black py-3 rounded-lg text-base uppercase tracking-wide transition ${editandoId?'bg-blue-600 hover:bg-blue-500':'bg-green-600 hover:bg-green-500'}`}>{editandoId?'Salvar Alterações':'Liberar Ordem de Produção'}</button></div>
              </form>
            </div>

            <div className="bg-gray-800 p-4 rounded-xl border border-gray-700">
              <div className="flex justify-between items-center mb-3 gap-3 flex-wrap">
                <h2 className="text-lg font-bold text-cyan-400">OPs em Andamento ({opsFiltradas.length})</h2>
                <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔎 Buscar OP ou cliente..." className="bg-gray-950 text-sm p-2 rounded-lg border border-gray-700 w-64"/>
              </div>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead className="bg-gray-950 text-gray-400 uppercase font-bold"><tr><th className="p-2">OP</th><th className="p-2">Estrutura</th><th className="p-2 text-center">Etapa</th><th className="p-2 text-center">Entrega</th><th className="p-2 text-center">Ações</th></tr></thead>
                  <tbody className="divide-y divide-gray-700">
                    {opsFiltradas.length===0 && <tr><td colSpan="5" className="p-3 text-gray-600 text-center">Nenhuma OP.</td></tr>}
                    {opsFiltradas.map(op=>(
                      <tr key={op.docId} className="hover:bg-gray-900/30">
                        <td className="p-2 font-mono font-bold text-yellow-400">{op.id} {opStarted(op) && <span className="text-[9px] bg-blue-900 text-blue-300 px-1 rounded ml-1">em produção</span>}</td>
                        <td className="p-2 text-gray-300">{op.cliente} | {op.maquina} | {op.conjunto}</td>
                        <td className="p-2 text-center text-gray-400">{op.etapaAtual}/{op.roteiro?.length}</td>
                        <td className="p-2 text-center font-mono text-gray-400">{op.dataEntrega?.split('-').reverse().join('/')}</td>
                        <td className="p-2 text-center space-x-1 whitespace-nowrap">
                          <button onClick={()=>editarOP(op)} className="bg-blue-900/50 text-blue-300 border border-blue-800 px-2 py-1 rounded font-bold">✏️ Editar</button>
                          {podeExcluir && <button onClick={()=>cancelarOP(op)} className="bg-amber-900/40 text-amber-300 border border-amber-800 px-2 py-1 rounded font-bold">🚫 Cancelar</button>}
                          {podeExcluir && <button onClick={()=>excluirOP(op)} className="bg-red-900/50 text-red-300 border border-red-800 px-2 py-1 rounded font-bold">🗑️ Excluir</button>}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>)}

          {/* ================= ABA ESTRUTURA (passo a passo) ================= */}
          {abaAtual==='estrutura' && (() => {
            const campo = "bg-gray-950 text-sm px-3 py-2.5 rounded-lg border border-gray-800 focus:border-blue-500 focus:outline-none";
            const fl = (arr,q) => { const t=q.trim().toLowerCase(); return t?arr.filter(x=>nomeDe(x).toLowerCase().includes(t)||String(x.desenho||'').toLowerCase().includes(t)):arr; };
            const optCli = clientes;
            const optMaq = maquinas.filter(m=>refCli(m)===pCli);
            const optConj = conjuntos.filter(c=>refMaq(c)===pMaq);
            const passos = [
              { id:'cliente', n:'1', label:'Cliente' },
              { id:'maquina', n:'2', label:'Máquina' },
              { id:'conjunto', n:'3', label:'Conjunto' },
              { id:'subconjunto', n:'4', label:'Subconjunto' },
            ];
            const Hint = ({txt}) => <p className="text-center text-gray-500 py-10 text-sm">👆 {txt}</p>;
            return (
            <div>
              {/* PASSOS */}
              <div className="grid grid-cols-4 gap-2 mb-5">
                {passos.map(p=>(
                  <button key={p.id} onClick={()=>setPasso(p.id)} className={`py-2.5 rounded-xl text-xs sm:text-sm font-black transition ${passo===p.id?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'bg-gray-800 text-gray-400 hover:text-white'}`}>
                    <span className="opacity-60 mr-1">{p.n}</span>{p.label}
                  </button>
                ))}
              </div>

              <div className="bg-[#0f1523] border border-gray-800 rounded-2xl p-4 md:p-5">

                {/* ---------- PASSO 1: CLIENTE ---------- */}
                {passo==='cliente' && (<div>
                  <h2 className="font-black text-blue-400 mb-3">Cadastrar Cliente</h2>
                  <div className="flex gap-2 mb-4">
                    <input value={inCli} onChange={e=>setInCli(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCli()} placeholder="Nome do cliente" className={`${campo} flex-1`}/>
                    <button onClick={addCli} className="bg-blue-600 hover:bg-blue-500 text-white font-black px-5 rounded-lg shrink-0">+ Adicionar</button>
                  </div>
                  <input value={buscaCli} onChange={e=>setBuscaCli(e.target.value)} placeholder="🔎 buscar" className={`${campo} w-full mb-2`}/>
                  <div className="divide-y divide-gray-800/60 max-h-72 overflow-y-auto">
                    {fl(clientes,buscaCli).length===0 && <p className="text-gray-600 text-sm py-6 text-center">Nenhum cliente ainda.</p>}
                    {fl(clientes,buscaCli).map(c=>(
                      <div key={idDe(c)} className="group flex items-center gap-3 px-2 py-3">
                        <span className="w-2 h-2 rounded-full bg-blue-500 shrink-0"></span>
                        {nomeEditavel('cliente',c)}
                        <span className="text-[10px] font-bold text-gray-500 bg-gray-800 px-2 py-0.5 rounded-full shrink-0">{maquinas.filter(m=>refCli(m)===idDe(c)).length} máq</span>
                        <button onClick={()=>delParametro(clientes,setClientes,'clientes',c,'cliente',maquinas.filter(m=>refCli(m)===idDe(c)).length)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 font-bold shrink-0">✕</button>
                      </div>
                    ))}
                  </div>
                </div>)}

                {/* ---------- PASSO 2: MÁQUINA ---------- */}
                {passo==='maquina' && (<div>
                  <h2 className="font-black text-cyan-400 mb-3">Cadastrar Máquina</h2>
                  <label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Cliente</label>
                  <select value={pCli} onChange={e=>{setPCli(e.target.value);setPMaq('');setPConj('');}} className={`${campo} w-full mb-4`}><option value="">— escolha o cliente —</option>{optCli.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select>
                  {!pCli ? <Hint txt="Escolha o cliente para cadastrar suas máquinas."/> : (<>
                    <div className="flex flex-wrap gap-2 mb-4">
                      <input value={inMaq} onChange={e=>setInMaq(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMaq()} placeholder="Nome da máquina" className={`${campo} flex-1 min-w-[150px]`}/>
                      <input value={inMaqDes} onChange={e=>setInMaqDes(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addMaq()} placeholder="Nº desenho" className={`${campo} w-32 font-mono`}/>
                      <button onClick={addMaq} className="bg-cyan-600 hover:bg-cyan-500 text-white font-black px-5 rounded-lg shrink-0">+ Adicionar</button>
                    </div>
                    <input value={fMaq} onChange={e=>setFMaq(e.target.value)} placeholder="🔎 buscar" className={`${campo} w-full mb-2`}/>
                    <div className="divide-y divide-gray-800/60 max-h-64 overflow-y-auto">
                      {fl(optMaq,fMaq).length===0 && <p className="text-gray-600 text-sm py-6 text-center">Nenhuma máquina neste cliente.</p>}
                      {fl(optMaq,fMaq).map(m=>(
                        <div key={idDe(m)} className="group flex items-center gap-3 px-2 py-3">
                          <span className="w-2 h-2 rounded-full bg-cyan-500 shrink-0"></span>
                          {nomeEditavel('maquina',m)}
                          {badgeDesenho('maquina',m)}
                          <button onClick={()=>delParametro(maquinas,setMaquinas,'maquinas',m,'maquina',conjuntos.filter(c=>refMaq(c)===idDe(m)).length)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 font-bold shrink-0">✕</button>
                        </div>
                      ))}
                    </div>
                  </>)}
                </div>)}

                {/* ---------- PASSO 3: CONJUNTO ---------- */}
                {passo==='conjunto' && (<div>
                  <h2 className="font-black text-emerald-400 mb-3">Cadastrar Conjunto</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <div><label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Cliente</label><select value={pCli} onChange={e=>{setPCli(e.target.value);setPMaq('');setPConj('');}} className={`${campo} w-full`}><option value="">— cliente —</option>{optCli.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select></div>
                    <div><label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Máquina</label><select value={pMaq} onChange={e=>{setPMaq(e.target.value);setPConj('');}} disabled={!pCli} className={`${campo} w-full disabled:opacity-40`}><option value="">— máquina —</option>{optMaq.map(m=><option key={idDe(m)} value={idDe(m)}>{nomeDe(m)}</option>)}</select></div>
                  </div>
                  {!pMaq ? <Hint txt="Escolha o cliente e a máquina para cadastrar os conjuntos."/> : (<>
                    <div className="flex flex-wrap gap-2 mb-4">
                      <input value={inConj} onChange={e=>setInConj(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addConj()} placeholder="Nome do conjunto" className={`${campo} flex-1 min-w-[150px]`}/>
                      <input value={inConjDes} onChange={e=>setInConjDes(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addConj()} placeholder="Nº desenho" className={`${campo} w-32 font-mono`}/>
                      <button onClick={addConj} className="bg-emerald-600 hover:bg-emerald-500 text-white font-black px-5 rounded-lg shrink-0">+ Adicionar</button>
                    </div>
                    <input value={fConj} onChange={e=>setFConj(e.target.value)} placeholder="🔎 buscar" className={`${campo} w-full mb-2`}/>
                    <div className="divide-y divide-gray-800/60 max-h-64 overflow-y-auto">
                      {fl(optConj,fConj).length===0 && <p className="text-gray-600 text-sm py-6 text-center">Nenhum conjunto nesta máquina.</p>}
                      {fl(optConj,fConj).map(c=>(
                        <div key={idDe(c)} className="group flex items-center gap-3 px-2 py-3">
                          <span className="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
                          {nomeEditavel('conjunto',c)}
                          {badgeDesenho('conjunto',c)}
                          <button onClick={()=>delParametro(conjuntos,setConjuntos,'conjuntos',c,'conjunto',subconjuntos.filter(sb=>refCj(sb)===idDe(c)).length)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 font-bold shrink-0">✕</button>
                        </div>
                      ))}
                    </div>
                  </>)}
                </div>)}

                {/* ---------- PASSO 4: SUBCONJUNTO ---------- */}
                {passo==='subconjunto' && (<div>
                  <h2 className="font-black text-purple-400 mb-3">Cadastrar Subconjunto</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                    <div><label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Cliente</label><select value={pCli} onChange={e=>{setPCli(e.target.value);setPMaq('');setPConj('');}} className={`${campo} w-full`}><option value="">— cliente —</option>{optCli.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select></div>
                    <div><label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Máquina</label><select value={pMaq} onChange={e=>{setPMaq(e.target.value);setPConj('');}} disabled={!pCli} className={`${campo} w-full disabled:opacity-40`}><option value="">— máquina —</option>{optMaq.map(m=><option key={idDe(m)} value={idDe(m)}>{nomeDe(m)}</option>)}</select></div>
                    <div><label className="block text-[11px] text-gray-400 font-bold uppercase mb-1">Conjunto</label><select value={pConj} onChange={e=>setPConj(e.target.value)} disabled={!pMaq} className={`${campo} w-full disabled:opacity-40`}><option value="">— conjunto —</option>{optConj.map(c=><option key={idDe(c)} value={idDe(c)}>{nomeDe(c)}</option>)}</select></div>
                  </div>
                  {!pConj ? <Hint txt="Escolha cliente, máquina e conjunto para cadastrar os subconjuntos."/> : (<>
                    <div className="flex flex-wrap gap-2 mb-4">
                      <input value={inSub} onChange={e=>setInSub(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSub()} placeholder="Nome do subconjunto" className={`${campo} flex-1 min-w-[150px]`}/>
                      <input value={inSubDes} onChange={e=>setInSubDes(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSub()} placeholder="Nº desenho" className={`${campo} w-32 font-mono`}/>
                      <button onClick={addSub} className="bg-purple-600 hover:bg-purple-500 text-white font-black px-5 rounded-lg shrink-0">+ Adicionar</button>
                    </div>
                    <input value={fSub} onChange={e=>setFSub(e.target.value)} placeholder="🔎 buscar" className={`${campo} w-full mb-2`}/>
                    <div className="divide-y divide-gray-800/60 max-h-64 overflow-y-auto">
                      {fl(subconjuntos.filter(sb=>refCj(sb)===pConj),fSub).length===0 && <p className="text-gray-600 text-sm py-6 text-center">Nenhum subconjunto neste conjunto.</p>}
                      {fl(subconjuntos.filter(sb=>refCj(sb)===pConj),fSub).map(sb=>(
                        <div key={idDe(sb)} className="group flex items-center gap-3 px-2 py-3">
                          <span className="w-2 h-2 rounded-full bg-purple-500 shrink-0"></span>
                          {nomeEditavel('subconjunto',sb)}
                          {badgeDesenho('subconjunto',sb)}
                          <button onClick={()=>delParametro(subconjuntos,setSubconjuntos,'subconjuntos',sb,'subconjunto',0)} className="text-gray-600 hover:text-red-400 opacity-0 group-hover:opacity-100 font-bold shrink-0">✕</button>
                        </div>
                      ))}
                    </div>
                  </>)}
                </div>)}

              </div>
            </div>
            );
          })()}

          {/* ================= ABA OPERADORES ================= */}
          {abaAtual==='operadores' && (<div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            {/* FORM */}
            <div className={`p-5 rounded-2xl border ${editandoUser?'bg-blue-950/40 border-blue-700':'bg-gray-800 border-gray-700'}`}>
              <div className="flex justify-between items-center mb-4">
                <h2 className={`text-lg font-black ${editandoUser?'text-blue-300':'text-blue-400'}`}>{editandoUser?`✏️ Editando @${editandoUser}`:'➕ Novo Operador'}</h2>
                {editandoUser && <button onClick={resetOperador} className="text-xs bg-gray-700 px-3 py-1.5 rounded font-bold">Cancelar</button>}
              </div>
              <div className="grid grid-cols-2 gap-3 mb-4">
                <div><label className="text-xs text-gray-400 font-bold">Login</label><input className={inp} placeholder="ex: rogers" value={opuLogin} onChange={e=>setOpuLogin(e.target.value)} disabled={!!editandoUser}/></div>
                <div><label className="text-xs text-gray-400 font-bold">Senha {editandoUser && <span className="text-gray-600">(deixe vazio p/ manter)</span>}</label><input className={inp} type="text" placeholder="senha" value={opuSenha} onChange={e=>setOpuSenha(e.target.value)}/></div>
              </div>
              <div className="mb-3">
                <p className="text-xs text-gray-400 font-bold mb-1">Perfil rápido:</p>
                <div className="flex gap-2 flex-wrap">{Object.keys(PRESETS).map(p=><button key={p} onClick={()=>aplicarPreset(p)} className="text-xs font-bold bg-gray-900 border border-gray-600 px-3 py-1.5 rounded-lg hover:border-blue-500">{p}</button>)}</div>
              </div>
              <p className="text-xs text-gray-400 font-bold mb-2">Permissões de acesso:</p>
              <div className="space-y-3">
                {FUNCOES.map(g=>(
                  <div key={g.grupo} className="bg-gray-950 rounded-lg p-3 border border-gray-800">
                    <p className="text-[10px] font-black text-gray-500 uppercase tracking-wider mb-2">{g.grupo}</p>
                    <div className="space-y-1.5">
                      {g.itens.map(it=>(
                        <label key={it.k} className="flex items-center gap-2 cursor-pointer text-sm">
                          <input type="checkbox" checked={!!opuPerms[it.k]} onChange={()=>togglePerm(it.k)} className="w-4 h-4 accent-blue-500"/>
                          <span className={opuPerms[it.k]?'text-white':'text-gray-400'}>{it.label}</span>
                        </label>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={salvarOperador} className="w-full mt-4 bg-blue-600 hover:bg-blue-500 font-black py-2.5 rounded-lg uppercase">{editandoUser?'Salvar Alterações':'Cadastrar Operador'}</button>
            </div>

            {/* LISTA */}
            <div className="bg-gray-800 p-5 rounded-2xl border border-gray-700">
              <h2 className="text-lg font-black text-white mb-4">Operadores ({usuarios.length})</h2>
              <div className="space-y-2 max-h-[70vh] overflow-y-auto">
                {usuarios.length===0 && <p className="text-gray-600 text-sm">Nenhum operador.</p>}
                {usuarios.map(u=>{
                  const perms = u.permissoes; const legado = !perms;
                  const ativos = legado ? TODAS_FUNCOES : TODAS_FUNCOES.filter(k=>perms[k]);
                  return (
                    <div key={u.login} className="bg-gray-950 rounded-xl p-3 border border-gray-800">
                      <div className="flex justify-between items-center mb-2">
                        <span className="font-bold text-white">👤 {u.login} {u.login===usuarioLogado && <span className="text-[9px] text-blue-400">(você)</span>}</span>
                        <div className="space-x-1">
                          <button onClick={()=>editarOperador(u)} className="bg-blue-900/50 text-blue-300 border border-blue-800 px-2 py-1 rounded text-[10px] font-bold">✏️ Editar</button>
                          <button onClick={()=>deletarUsuario(u.login)} className="bg-red-900/50 text-red-300 border border-red-800 px-2 py-1 rounded text-[10px] font-bold">🗑️</button>
                        </div>
                      </div>
                      <div className="flex flex-wrap gap-1">
                        {legado && <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-amber-900/50 text-amber-300">acesso total (legado)</span>}
                        {!legado && ativos.length===0 && <span className="text-[9px] text-gray-600">sem acesso</span>}
                        {!legado && ativos.map(k=><span key={k} className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-gray-800 text-gray-300">{LABEL_CURTO[k]}</span>)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* ZONA DE PERIGO (ADM) */}
            <div className="lg:col-span-2 bg-red-950/30 border-2 border-red-800 rounded-2xl p-5">
              <h2 className="text-lg font-black text-red-400 mb-1">🧨 Zona de Perigo</h2>
              <p className="text-xs text-gray-400 mb-4">Ações destrutivas. Só o ADM vê isto. Faça um backup antes de qualquer coisa.</p>
              <div className="flex flex-wrap gap-3 items-center">
                <button onClick={()=>{ baixarBackup('backup'); toast('Backup baixado.'); }} className="bg-gray-700 hover:bg-gray-600 font-bold px-4 py-2.5 rounded-lg text-sm">💾 Baixar Backup</button>
                <button onClick={zerarDados} className="bg-red-600 hover:bg-red-500 font-black px-4 py-2.5 rounded-lg text-sm uppercase tracking-wide">🗑️ Zerar Dados do Sistema</button>
                <span className="text-[11px] text-gray-500">Apaga OPs + estrutura. Mantém operadores e senhas. Baixa backup automático antes.</span>
              </div>
            </div>
          </div>)}

          {/* TOASTS */}
          <div className="fixed bottom-4 right-4 z-50 space-y-2">
            {toasts.map(t=>(<div key={t.id} className={`px-4 py-2.5 rounded-lg shadow-lg text-sm font-bold border ${t.tipo==='erro'?'bg-red-950 border-red-700 text-red-200':t.tipo==='aviso'?'bg-amber-950 border-amber-700 text-amber-200':'bg-emerald-950 border-emerald-700 text-emerald-200'}`}>{t.tipo==='erro'?'⛔ ':t.tipo==='aviso'?'⚠️ ':'✅ '}{t.msg}</div>))}
          </div>

          {/* CONFIRM MODAL */}
          {confirmar && (
            <div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4" onClick={()=>{setConfirmar(null);setConfirmInput('');}}>
              <div className="bg-gray-800 rounded-2xl border border-gray-600 p-6 w-full max-w-sm shadow-2xl" onClick={e=>e.stopPropagation()}>
                <h3 className="text-lg font-black text-white mb-2">{confirmar.titulo}</h3>
                <p className="text-sm text-gray-300 mb-4">{confirmar.msg}</p>
                {confirmar.exigir && <input autoFocus value={confirmInput} onChange={e=>setConfirmInput(e.target.value)} placeholder={confirmar.exigir} className="w-full bg-gray-950 p-2 rounded-lg border border-gray-600 font-mono text-yellow-400 mb-4"/>}
                <div className="flex gap-2">
                  <button onClick={()=>{setConfirmar(null);setConfirmInput('');}} className="flex-1 bg-gray-700 py-2.5 rounded-lg font-bold">Cancelar</button>
                  <button disabled={confirmar.exigir && confirmInput.trim()!==confirmar.exigir} onClick={()=>{confirmar.onOk();setConfirmar(null);setConfirmInput('');}} className="flex-1 bg-red-600 hover:bg-red-500 py-2.5 rounded-lg font-black disabled:opacity-30 disabled:cursor-not-allowed">Confirmar</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <!-- ===== PWA: service worker + botão instalar ===== -->
  <script>
    if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const b=document.getElementById('pwa-install'); if(b) b.style.display='flex'; });
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.id='pwa-install'; btn.textContent='⬇️ Instalar app';
      btn.style.cssText='display:none;align-items:center;position:fixed;bottom:16px;left:16px;z-index:9999;background:#2563eb;color:#fff;font-weight:800;font-size:12px;padding:10px 14px;border:none;border-radius:12px;box-shadow:0 4px 14px rgba(37,99,235,.4);cursor:pointer;';
      btn.onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; btn.style.display='none'; };
      document.body.appendChild(btn);
    });
    window.addEventListener('appinstalled', () => { const b=document.getElementById('pwa-install'); if(b) b.style.display='none'; });
  </script>
</body>
</html>
