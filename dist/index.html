  <script type="text/babel">
    const { useState, useEffect, useRef, memo } = React;

    const ORDEM_SETORES = ['Corte','Dobra','Caldeiraria','Solda','Usinagem','Pintura','Expedição','Finalizada'];

    function sha256(str){
      const bytes = unescape(encodeURIComponent(str));
      function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
      const mp=Math.pow, maxW=mp(2,32); let h=[],k=[],pc=0,comp={};
      for(let c=2;pc<64;c++){ if(!comp[c]){ for(let i=0;i<313;i+=c) comp[i]=c; h[pc]=(mp(c,.5)*maxW)|0; k[pc++]=(mp(c,1/3)*maxW)|0; } }
      let asc=bytes+'\x80'; while(asc.length%64-56) asc+='\x00';
      const words=[]; const bitLen=bytes.length*8;
      for(let i=0;i<asc.length;i++){ const j=asc.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
      words[words.length]=(bitLen/maxW)|0; words[words.length]=bitLen;
      for(let j=0;j<words.length;){
        const w=words.slice(j,j+=16); const old=h; h=h.slice(0,8);
        for(let i=0;i<64;i++){
          const w15=w[i-15],w2=w[i-2],a=h[0],e=h[4];
          const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]
            +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
          const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
          h=[(t1+t2)|0].concat(h); h[4]=(h[4]+t1)|0;
        }
        for(let i=0;i<8;i++) h[i]=(h[i]+old[i])|0;
      }
      let out=''; for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(h[i]>>(j*8))&255; out+=((b<16)?'0':'')+b.toString(16); }
      return out;
    }
    function calcStatus(op){
      const r = op.roteiro || [];
      if (op.cancelada) return 'Cancelada';
      if ((op.etapaAtual||0) >= r.length) return 'Concluído';
      if (!op.dataEntrega) return 'No Prazo';
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const diff = Math.round((new Date(op.dataEntrega+'T00:00:00') - hoje)/86400000);
      if (diff < 0) return 'Atrasado'; if (diff <= 2) return 'Atenção'; return 'No Prazo';
    }
    const corStatus = { 'Atrasado':'bg-red-600', 'Atenção':'bg-amber-500 text-black', 'No Prazo':'bg-emerald-600', 'Concluído':'bg-blue-600' };
    const borderStatus = { 'Atrasado':'border-red-600', 'Atenção':'border-amber-500', 'No Prazo':'border-emerald-600', 'Concluído':'border-blue-600' };
    function entradaSetor(op, i){ if(i<=0) return op.total||0; const r=op.roteiro||[]; const a=(op.historicoTempos||{})[r[i-1]]; return (a&&typeof a.qtd==='number')?a.qtd:(op.total||0); }
    function refugoTotal(op){ const r=op.roteiro||[]; let x=0; for(let i=0;i<r.length;i++){ const h=(op.historicoTempos||{})[r[i]]; if(h&&typeof h.qtd==='number') x+=Math.max(0,entradaSetor(op,i)-h.qtd); } return x; }
    function fmtDataHora(iso){ if(!iso) return null; try { return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); } catch(e){ return null; } }
    function ultimaAtualizacao(op){
      if(op.atualizadoEm) return { quando: op.atualizadoEm, quem: op.atualizadoPor };
      let best=null; // deriva do histórico se a OP for antiga
      Object.values(op.historicoTempos||{}).forEach(h=>{ const t=h.fim||h.inicio; if(t && (!best||t>best.quando)) best={quando:t, quem:h.por||null}; });
      return best || { quando:null, quem:null };
    }

    // ===== PERMISSÕES (controle operacional) =====
    function getPerms(){ try{ return JSON.parse(sessionStorage.getItem('calfer_perms')); }catch(e){ return null; } }
    const PERM_FALLBACK = { apRecuar:'apontamento', apPDF:'apontamento', histExportar:'historico', histBackup:'historico' };
    function podeAcessar(k){ const p=getPerms(); if(!p) return true; if(k in p) return !!p[k]; if(PERM_FALLBACK[k]) return !!p[PERM_FALLBACK[k]]; return false; } // sem perms = legado = acesso total
    function primeiraRota(){
      if(podeAcessar('dashboard')) return 'index.html';
      if(podeAcessar('apontamento')) return 'dados.html';
      if(podeAcessar('ops')||podeAcessar('estrutura')||podeAcessar('operadores')) return 'cadastro.html';
      if(podeAcessar('historico')) return 'historico.html';
      return 'index.html';
    }

    // ===== HEADER UNIFICADO (idêntico nos arquivos) =====
    function Header({ active, user, extra }){
      const sair = () => { sessionStorage.removeItem('calfer_user'); sessionStorage.removeItem('calfer_perms'); window.location.href='index.html'; };
      const Nav = ({href,id,children}) => (
        <a href={href} className={`px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition ${active===id?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'text-gray-400 hover:text-white hover:bg-gray-800'}`}>{children}</a>
      );
      return (
        <header className="shrink-0 bg-[#0f1523] border border-gray-800 rounded-2xl px-4 py-2.5 flex flex-wrap gap-3 justify-between items-center">
          <div className="flex items-center gap-4">
            <div className="bg-white p-1.5 rounded-xl shadow"><img src="https://iili.io/CYuzbaV.png" alt="CALFER" className="h-9 object-contain"/></div>
            <div className="border-r border-gray-800 pr-4 hidden sm:block">
              <h1 className="text-xl font-black text-white leading-none tracking-tight">CONTROLE DE <span className="text-blue-500">OP</span></h1>
              <p className="text-gray-500 text-[9px] font-bold tracking-[0.15em] mt-0.5">CALFER · CALDEIRARIA E FERRAMENTARIA</p>
            </div>
            <nav className="flex gap-1.5">
              {podeAcessar('dashboard') && <Nav href="index.html" id="dashboard">Dashboard</Nav>}
              {podeAcessar('apontamento') && <Nav href="dados.html" id="apontamento">Apontamento</Nav>}
              {(podeAcessar('ops')||podeAcessar('estrutura')||podeAcessar('operadores')) && <Nav href="cadastro.html" id="cadastros">Cadastros</Nav>}
              {podeAcessar('historico') && <Nav href="historico.html" id="historico">Histórico</Nav>}
            </nav>
          </div>
          <div className="flex items-center gap-3">
            {extra}
            {user && <span className="text-xs font-mono text-gray-300 bg-gray-800 px-3 py-1.5 rounded-lg">👤 {user}</span>}
            <button onClick={sair} className="text-xs font-bold text-red-400 bg-red-950/40 border border-red-900 px-3 py-1.5 rounded-lg hover:bg-red-900/40">Sair</button>
          </div>
        </header>
      );
    }

    // ===== DONUT pequeno e discreto =====
    function DonutMini({ segments, total, pct }){
      const size=92, stroke=13, r=(size-stroke)/2, C=2*Math.PI*r; let acc=0;
      return (
        <div className="relative shrink-0" style={{width:size,height:size}}>
          <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
            <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1f2937" strokeWidth={stroke}/>
            {segments.filter(s=>s.value>0).map((s,i)=>{ const len=total?(s.value/total)*C:0; const el=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={s.color} strokeWidth={stroke} strokeDasharray={`${len} ${C-len}`} strokeDashoffset={-acc}/>; acc+=len; return el; })}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center"><span className="text-lg font-black text-white leading-none">{pct}%</span><span className="text-[8px] text-gray-400 uppercase">no prazo</span></div>
        </div>
      );
    }

    // ===== RELÓGIO + CONEXÃO =====
    const StatusBar = memo(function StatusBar({ onlineRef }){
      const [, tick] = useState(0);
      useEffect(() => { const t=setInterval(()=>tick(v=>v+1),1000); return ()=>clearInterval(t); }, []);
      const agora=new Date(); const online=onlineRef.current;
      return (
        <div className="text-right font-mono flex items-center gap-4">
          <div className="flex items-center gap-2">
            <span className={`w-2.5 h-2.5 rounded-full ${online?'bg-emerald-400':'bg-red-500 animate-ping'}`}></span>
            <span className={`text-xs font-bold ${online?'text-emerald-400':'text-red-400'}`}>{online?'ao vivo':'RECONECTANDO'}</span>
          </div>
          <div className="hidden md:block"><p className="text-2xl font-black text-white leading-none">{agora.toLocaleTimeString('pt-BR')}</p><p className="text-gray-500 text-[9px] uppercase tracking-widest">{agora.toLocaleDateString('pt-BR')}</p></div>
        </div>
      );
    });

    // ===== CARD DE OP (detalhado, com barra de progresso) =====
    const CardOP = memo(function CardOP({ op }){
      const r = op.roteiro || []; const setor = r[op.etapaAtual] || 'FIM';
      const pct = r.length ? Math.round((op.etapaAtual / r.length)*100) : 0;
      const refugo = refugoTotal(op);
      const critico = op.status === 'Atrasado';
      const feitas = op.feitas ?? 0;
      const criador = op.criadoPor || '—';
      const ult = ultimaAtualizacao(op); const ultTxt = fmtDataHora(ult.quando);
      return (
        <div className={`p-3 rounded-2xl flex flex-col gap-1.5 border-2 ${critico?'bg-red-950/40 pulse-red':'bg-[#0f1523]'} ${borderStatus[op.status]}`}>
          <div className="flex justify-between items-center">
            <span className="text-2xl font-black text-blue-400 font-mono">{op.id}</span>
            <span className={`px-2 py-0.5 rounded text-[11px] font-black uppercase ${corStatus[op.status]}`}>{op.status}</span>
          </div>
          <div className="border-b border-gray-800 pb-1.5">
            <p className="text-lg font-black truncate leading-tight">{op.cliente}</p>
            <p className="text-[13px] text-gray-400 truncate font-mono">{op.maquina} › {op.conjunto}{op.subconjunto&&op.subconjunto!=='-'?` › ${op.subconjunto}`:''}{op.notaFiscal&&op.notaFiscal!=='-'?` · NF ${op.notaFiscal}`:''}</p>
          </div>
          <div className="flex justify-between items-center bg-gray-950 px-3 py-1 rounded-lg">
            <div><p className="text-[10px] text-gray-500 font-bold uppercase leading-none">Setor</p><p className="text-base font-black text-amber-400 uppercase leading-tight">{setor}</p></div>
            <div className="text-right"><p className="text-[10px] text-gray-500 font-bold uppercase leading-none">Prazo</p><p className="text-base font-mono text-gray-200 font-bold leading-tight">{op.dataEntrega?.split('-').reverse().join('/')}</p></div>
          </div>
          <div>
            <div className="flex justify-between text-xs text-gray-400 mb-0.5"><span>Etapa {op.etapaAtual}/{r.length}</span><span className="font-black text-white">{pct}%</span></div>
            <div className="w-full bg-gray-950 rounded-full h-2.5 overflow-hidden"><div className={`h-full rounded-full ${critico?'bg-red-500':'bg-blue-500'}`} style={{width:`${pct}%`}}></div></div>
          </div>
          <div className="flex justify-between items-center text-xs text-gray-400">
            <span>Falta <strong className="text-white">{op.total-feitas}</strong></span>
            <span>{feitas}/{op.total} pçs</span>
            {refugo>0 && <span className="text-red-400 font-bold">⚠ {refugo} refugo</span>}
          </div>
          <div className="flex justify-between items-center text-[10px] text-gray-500 border-t border-gray-800/70 pt-1 gap-2">
            <span className="truncate">criou <b className="text-gray-400">@{criador}</b></span>
            <span className="truncate text-right">atualizou <b className="text-gray-400">@{ult.quem||'—'}</b>{ultTxt?` · ${ultTxt}`:''}</span>
          </div>
        </div>
      );
    });

    function App() {
      const [user, setUser] = useState(sessionStorage.getItem('calfer_user'));
      const [login, setLogin] = useState('');
      const [senha, setSenha] = useState('');
      const [erro, setErro] = useState('');
      const [ordens, setOrdens] = useState([]);
      const [somOn, setSomOn] = useState(false);
      const [shift, setShift] = useState(0);
      const [filtro, setFiltro] = useState('ativas');
      const onlineRef = useRef(true);
      const audioRef = useRef(null);
      const prevAtrasoRef = useRef(0);

      useEffect(() => {
        if(!user) return;
        const unsub = db.collection('ordens').onSnapshot({ includeMetadataChanges:true }, (snap) => {
          onlineRef.current = !snap.metadata.fromCache;
          setOrdens(snap.docs.map(doc => { const op=doc.data(); return { ...op, status:calcStatus(op) }; }));
        }, () => { onlineRef.current = false; });
        return () => unsub();
      }, [user]);

      useEffect(() => { const t=setInterval(()=>setShift(s=>(s+1)%5),60000); return ()=>clearInterval(t); }, []);
      useEffect(() => { if(user && getPerms() && !podeAcessar('dashboard')) window.location.href=primeiraRota(); }, [user]);
      useEffect(() => { document.body.style.transform=`translate(${shift}px,${shift}px)`; }, [shift]);

      const ordensAtivas = ordens.filter(o => o.status !== 'Concluído' && o.status !== 'Cancelada').sort((a,b)=>{
        const rank=s=>s==='Atrasado'?0:s==='Atenção'?1:2;
        if(rank(a.status)!==rank(b.status)) return rank(a.status)-rank(b.status);
        return (a.dataEntrega||'9999').localeCompare(b.dataEntrega||'9999');
      });
      const atrasadas = ordens.filter(o=>o.status==='Atrasado').length;
      const atencao   = ordens.filter(o=>o.status==='Atenção').length;
      const noPrazo   = ordensAtivas.filter(o=>o.status==='No Prazo').length;
      const concluidas= ordens.filter(o=>o.status==='Concluído').length;
      const aguardando= ordensAtivas.filter(o=>(o.etapaAtual||0)===0 && !o.feitas).length;
      const fabricando= ordensAtivas.length - aguardando;
      const refugo    = ordens.reduce((s,o)=>s+refugoTotal(o),0);
      const pctPrazo  = ordensAtivas.length ? Math.round((noPrazo/ordensAtivas.length)*100) : 100;

      // ===== Painéis da lateral =====
      // 1) Gargalo: OPs paradas por setor atual
      const fila = {};
      ordensAtivas.forEach(op=>{ const s=(op.roteiro||[])[op.etapaAtual]; if(s) fila[s]=(fila[s]||0)+1; });
      const gargalo = Object.entries(fila).sort((a,b)=>b[1]-a[1]);
      const maxFila = Math.max(1, ...gargalo.map(g=>g[1]));
      // 2) Próximas entregas: vencidas + até 3 dias
      const hojeISO = new Date().toISOString().slice(0,10);
      const lim = new Date(); lim.setDate(lim.getDate()+3); const limISO = lim.toISOString().slice(0,10);
      const proximas72 = ordensAtivas.filter(o=>o.dataEntrega && o.dataEntrega<=limISO).sort((a,b)=>a.dataEntrega.localeCompare(b.dataEntrega)).slice(0,5);
      const diasPara = (d) => Math.round((new Date(d+'T00:00:00') - new Date(hojeISO+'T00:00:00'))/86400000);
      // 3) Produção de hoje
      let pecasHoje=0, avancosHoje=0, opsConcluidasHoje=0;
      ordens.forEach(op=>{ const r=op.roteiro||[];
        Object.values(op.historicoTempos||{}).forEach(h=>{ if(h.fim && h.fim.slice(0,10)===hojeISO){ avancosHoje++; if(typeof h.qtd==='number') pecasHoje+=h.qtd; } });
        if(r.length && (op.etapaAtual||0)>=r.length){ const h=(op.historicoTempos||{})[r[r.length-1]]; if(h&&h.fim&&h.fim.slice(0,10)===hojeISO) opsConcluidasHoje++; }
      });

      useEffect(() => {
        if (somOn && atrasadas>prevAtrasoRef.current && audioRef.current) {
          const ctx=audioRef.current, o=ctx.createOscillator(), g=ctx.createGain();
          o.connect(g); g.connect(ctx.destination); o.type='square'; o.frequency.value=880;
          g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.3,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+0.9);
          o.start(); o.stop(ctx.currentTime+0.9);
        }
        prevAtrasoRef.current = atrasadas;
      }, [atrasadas, somOn]);
      const ativarSom = () => { audioRef.current = new (window.AudioContext||window.webkitAudioContext)(); setSomOn(true); };

      const logar = async (e) => {
        e.preventDefault(); setErro('');
        const ref = login.toLowerCase().trim();
        try {
          const doc = await db.collection('usuarios').doc(ref).get();
          if(!doc.exists) return setErro('Usuário ou senha inválidos.');
          const data = doc.data(); const hash = sha256(senha);
          if (data.senha===hash) ok(data);
          else if (data.senha===senha) { await db.collection('usuarios').doc(ref).update({senha:hash}); ok(data); }
          else setErro('Usuário ou senha inválidos.');
        } catch(err){ setErro('Erro ao conectar: '+err.message); }
        function ok(data){ sessionStorage.setItem('calfer_user', ref); sessionStorage.setItem('calfer_perms', JSON.stringify(data.permissoes || null)); setUser(ref); if(data.permissoes && !data.permissoes.dashboard) window.location.href=primeiraRota(); }
      };

      if (!user) return (
        <div className="min-h-screen w-full flex items-center justify-center p-4 bg-cover bg-center relative" style={{ backgroundImage:"url('https://iili.io/CYMq9Wl.png')" }}>
          <div className="absolute inset-0 bg-gradient-to-br from-[#0b0f19]/95 via-[#0b0f19]/85 to-[#0f1523]/75"></div>
          <form onSubmit={logar} className="relative z-10 w-full max-w-sm bg-[#0f1523]/85 backdrop-blur-md p-8 rounded-3xl border border-blue-500/20 shadow-2xl shadow-blue-600/10">
            <div className="flex justify-center mb-4"><div className="bg-white p-2 rounded-2xl shadow-lg"><img src="https://iili.io/CYuzbaV.png" alt="CALFER" className="h-14 object-contain"/></div></div>
            <div className="text-center mb-6">
              <h1 className="text-3xl font-black text-white tracking-tight leading-none">CONTROLE DE <span className="text-blue-500">OP</span></h1>
              <p className="text-gray-400 text-[11px] font-bold uppercase tracking-[0.2em] mt-1">CALFER · Caldeiraria e Ferramentaria</p>
            </div>
            <input className="w-full bg-gray-950/70 p-3 rounded-xl mb-3 border border-gray-700 text-sm focus:border-blue-500 focus:outline-none transition" placeholder="Usuário" value={login} onChange={e=>setLogin(e.target.value)}/>
            <input className="w-full bg-gray-950/70 p-3 rounded-xl mb-3 border border-gray-700 text-sm focus:border-blue-500 focus:outline-none transition" type="password" placeholder="Senha" value={senha} onChange={e=>setSenha(e.target.value)}/>
            {erro && <p className="text-red-400 text-xs font-bold mb-3 text-center">⛔ {erro}</p>}
            <button className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-black uppercase tracking-wider transition shadow-lg shadow-blue-600/30">Entrar</button>
            <p className="text-center text-gray-600 text-[10px] mt-4">Após entrar, acesse o Apontamento ou os Cadastros.</p>
          </form>
        </div>
      );

      const proxima = ordensAtivas.filter(o=>o.dataEntrega)[0];

      // filtros dos indicadores clicáveis
      const filtros = {
        ativas:     { label:'todas as OPs ativas', fn: ()=>ordensAtivas },
        aguardando: { label:'aguardando início',   fn: ()=>ordensAtivas.filter(o=>(o.etapaAtual||0)===0 && !o.feitas) },
        producao:   { label:'em produção',         fn: ()=>ordensAtivas.filter(o=>!((o.etapaAtual||0)===0 && !o.feitas)) },
        atrasadas:  { label:'atrasadas',           fn: ()=>ordensAtivas.filter(o=>o.status==='Atrasado') },
      };
      const cardsExibidos = (filtros[filtro]||filtros.ativas).fn();

      const KPI = ({id,label,valor,cor,pulse}) => (
        <button onClick={()=>setFiltro(f=>f===id?'ativas':id)} className={`text-left bg-[#0f1523] rounded-xl border-l-4 ${cor} px-4 py-3 transition ${pulse?'pulse-red':''} ${filtro===id?'ring-2 ring-white/70 bg-[#16203a]':'hover:bg-[#141a2c]'}`}>
          <p className="text-gray-400 text-[11px] font-bold uppercase tracking-wide leading-none">{label}</p>
          <p className="text-3xl font-black mt-1 leading-none">{valor}</p>
        </button>
      );

      return (
        <div className="flex flex-col lg:h-full p-3 sm:p-4 gap-3">
          <Header active="dashboard" user={user} extra={<>
            {!somOn && <button onClick={ativarSom} className="text-xs font-bold bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-lg text-amber-300 hover:bg-gray-700">🔔 Som</button>}
            <StatusBar onlineRef={onlineRef}/>
          </>}/>

          {atrasadas>0 ? (
            <div className="shrink-0 blink-bg text-white px-5 py-2 rounded-2xl flex items-center justify-center gap-3 shadow-lg text-center">
              <span className="text-xl">🚨</span><span className="text-base sm:text-lg font-black uppercase tracking-wide">{atrasadas} OP(s) ATRASADA(S){proxima?` · próxima: ${proxima.id} em ${proxima.dataEntrega.split('-').reverse().join('/')}`:''}</span>
            </div>
          ) : (
            <div className="shrink-0 bg-emerald-900/25 border border-emerald-800 px-5 py-2 rounded-2xl flex items-center justify-center gap-2 text-center">
              <span className="text-lg">✅</span><span className="text-sm sm:text-base font-black uppercase tracking-wide text-emerald-300">Fluxo planejado{proxima?` · próxima: ${proxima.id} em ${proxima.dataEntrega.split('-').reverse().join('/')}`:''}</span>
            </div>
          )}

          {/* CORPO: indicadores à esquerda (coluna) + cards à direita */}
          <div className="flex-1 flex flex-col lg:flex-row gap-3 lg:min-h-0">
            {/* SIDEBAR DE INDICADORES */}
            <aside className="shrink-0 lg:w-56 grid grid-cols-2 lg:grid-cols-1 gap-2 lg:content-start lg:overflow-y-auto lg:pr-1">
              <KPI id="ativas"     label="OPs Ativas"   valor={ordensAtivas.length} cor="border-blue-500"/>
              <KPI id="aguardando" label="Aguardando"   valor={aguardando} cor="border-amber-500"/>
              <KPI id="producao"   label="Em Produção"  valor={fabricando} cor="border-cyan-500"/>
              <KPI id="atrasadas"  label="Atrasadas"    valor={atrasadas} cor="border-red-500" pulse={atrasadas>0}/>
              {filtro!=='ativas' && <button onClick={()=>setFiltro('ativas')} className="col-span-2 lg:col-span-1 text-xs font-bold text-blue-400 hover:text-blue-300 bg-gray-800/50 border border-gray-700 rounded-lg py-2">✕ limpar filtro</button>}

              {/* PAINEL 1 — GARGALO */}
              <div className="col-span-2 lg:col-span-1 bg-[#0f1523] border border-gray-800 rounded-xl p-3">
                <h3 className="text-amber-400 font-black text-[11px] uppercase tracking-wide mb-2">⛓️ Fila por Setor</h3>
                {gargalo.length===0 ? <p className="text-gray-600 text-[11px]">Sem OPs ativas.</p> : gargalo.slice(0,6).map(([s,n],i)=>(
                  <div key={s} className="mb-1.5 last:mb-0">
                    <div className="flex justify-between text-[11px] mb-0.5"><span className={i===0?'text-red-400 font-bold uppercase':'text-gray-300 uppercase'}>{i===0&&'🔴 '}{s}</span><span className="font-black text-white">{n}</span></div>
                    <div className="w-full bg-gray-950 rounded-full h-1.5 overflow-hidden"><div className={`h-full rounded-full ${i===0?'bg-red-500':'bg-blue-500'}`} style={{width:`${(n/maxFila)*100}%`}}></div></div>
                  </div>
                ))}
              </div>

              {/* PAINEL 2 — PRÓXIMAS ENTREGAS */}
              <div className="col-span-2 lg:col-span-1 bg-[#0f1523] border border-gray-800 rounded-xl p-3">
                <h3 className="text-cyan-400 font-black text-[11px] uppercase tracking-wide mb-2">📅 Próximas Entregas</h3>
                {proximas72.length===0 ? <p className="text-gray-600 text-[11px]">Nada nos próximos 3 dias.</p> : proximas72.map(op=>{
                  const d=diasPara(op.dataEntrega);
                  const lbl = d<0?`${-d}d atraso`:d===0?'hoje':`em ${d}d`;
                  const cor = d<0?'bg-red-600':d===0?'bg-amber-500 text-black':'bg-gray-700';
                  return (
                    <div key={op.id} className="flex justify-between items-center gap-2 py-1 border-b border-gray-800/50 last:border-0">
                      <div className="min-w-0"><span className="font-mono font-bold text-blue-400 text-[11px]">{op.id}</span><p className="text-gray-500 text-[10px] truncate">{op.cliente}</p></div>
                      <span className={`shrink-0 text-[9px] font-black px-1.5 py-0.5 rounded uppercase ${cor}`}>{lbl}</span>
                    </div>
                  );
                })}
              </div>

              {/* PAINEL 3 — PRODUÇÃO DE HOJE */}
              <div className="col-span-2 lg:col-span-1 bg-[#0f1523] border border-gray-800 rounded-xl p-3">
                <h3 className="text-emerald-400 font-black text-[11px] uppercase tracking-wide mb-2">🏭 Produção de Hoje</h3>
                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-gray-950 rounded-lg py-2 text-center"><p className="text-2xl font-black text-emerald-400 leading-none">{pecasHoje}</p><p className="text-[9px] text-gray-500 uppercase mt-1">peças</p></div>
                  <div className="bg-gray-950 rounded-lg py-2 text-center"><p className="text-2xl font-black text-blue-400 leading-none">{opsConcluidasHoje}</p><p className="text-[9px] text-gray-500 uppercase mt-1">OPs prontas</p></div>
                </div>
                <p className="text-[10px] text-gray-500 mt-2 text-center">{avancosHoje} avanço(s) de setor hoje</p>
              </div>
            </aside>

            {/* CARDS DE OP */}
            <main className="flex-1 lg:min-h-0 lg:overflow-y-auto pr-1">
              <p className="text-xs text-gray-500 uppercase tracking-wide font-bold mb-2 px-1">Mostrando: <span className="text-gray-300">{(filtros[filtro]||filtros.ativas).label}</span> ({cardsExibidos.length})</p>
              {cardsExibidos.length===0 && <div className="text-center text-gray-600 py-16">Nenhuma OP {(filtros[filtro]||filtros.ativas).label}.</div>}
              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                {cardsExibidos.map(op => <CardOP key={op.id} op={op}/>)}
              </div>
            </main>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <!-- ===== PWA: service worker + botão instalar ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const b=document.getElementById('pwa-install'); if(b) b.style.display='flex'; });
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.id='pwa-install'; btn.textContent='⬇️ Instalar app';
      btn.style.cssText='display:none;align-items:center;position:fixed;bottom:16px;left:16px;z-index:9999;background:#2563eb;color:#fff;font-weight:800;font-size:12px;padding:10px 14px;border:none;border-radius:12px;box-shadow:0 4px 14px rgba(37,99,235,.4);cursor:pointer;';
      btn.onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; btn.style.display='none'; };
      document.body.appendChild(btn);
    });
    window.addEventListener('appinstalled', () => { const b=document.getElementById('pwa-install'); if(b) b.style.display='none'; });
  </script>
</body>
</html>
