<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apontamento - CALFER</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1523">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Controle de OP">
  <link rel="apple-touch-icon" href="https://iili.io/CYuzbaV.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check-compat.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-4 md:p-6">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, memo } = React;

    const firebaseConfig = {
      apiKey: "AIzaSyBklrPZ1XCFoD23BZqJpqg_SNODPiA7VUo",
      authDomain: "sistema-gestao-na-tela.firebaseapp.com",
      databaseURL: "https://sistema-gestao-na-tela-default-rtdb.firebaseio.com",
      projectId: "sistema-gestao-na-tela",
      storageBucket: "sistema-gestao-na-tela.firebasestorage.app",
      messagingSenderId: "1046960265027",
      appId: "1:1046960265027:web:52a4443205c0bf0d65c1f6",
      measurementId: "G-EH4NQ3XN5Q"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    // ===== APP CHECK (segurança): cole sua site key do reCAPTCHA v3 abaixo =====
    const APP_CHECK_SITE_KEY = '6LdTlEEtAAAAAE2q7GHUrHKouUfTqU6LR_lyTXoE';
    if (APP_CHECK_SITE_KEY && !APP_CHECK_SITE_KEY.startsWith('COLE_')) {
      try { firebase.appCheck().activate(APP_CHECK_SITE_KEY, true); } catch(e) { console.warn('App Check falhou:', e); }
    }
    const db = firebase.firestore();

    // ===== CONFIG: ajuste à jornada real da fábrica =====
    const JORNADA = { dias:[1,2,3,4,5], inicio:'07:00', almocoIni:'12:00', almocoFim:'13:00', fim:'17:00' };
    const ORDEM_SETORES = ['Corte','Dobra','Caldeiraria','Solda','Usinagem','Pintura','Expedição','Finalizada'];

    function calcStatus(op){
      const r = op.roteiro || [];
      if (op.cancelada) return 'Cancelada';
      if ((op.etapaAtual||0) >= r.length) return 'Concluído';
      if (!op.dataEntrega) return 'No Prazo';
      const hoje = new Date(); hoje.setHours(0,0,0,0);
      const diff = Math.round((new Date(op.dataEntrega+'T00:00:00') - hoje)/86400000);
      if (diff < 0) return 'Atrasado'; if (diff <= 2) return 'Atenção'; return 'No Prazo';
    }
    function parseHM(base, hm){ const [h,m]=hm.split(':').map(Number); const d=new Date(base); d.setHours(h,m,0,0); return d; }
    function tempoUtilMin(iniISO, fimISO){
      if(!iniISO) return 0;
      const ini = new Date(iniISO); const fim = fimISO ? new Date(fimISO) : new Date();
      if(fim <= ini) return 0;
      let total = 0; const cursor = new Date(ini); cursor.setHours(0,0,0,0);
      const ultimo = new Date(fim); ultimo.setHours(0,0,0,0);
      while(cursor <= ultimo){
        if(JORNADA.dias.includes(cursor.getDay())){
          const blocos = [[parseHM(cursor,JORNADA.inicio),parseHM(cursor,JORNADA.almocoIni)],[parseHM(cursor,JORNADA.almocoFim),parseHM(cursor,JORNADA.fim)]];
          for(const [bi,bf] of blocos){ const s=Math.max(bi,ini), e=Math.min(bf,fim); if(e>s) total += (e-s)/60000; }
        }
        cursor.setDate(cursor.getDate()+1);
      }
      return Math.floor(total);
    }
    function fmtMin(min){ if(min<=0) return '0m'; if(min<60) return `${min}m`; return `${Math.floor(min/60)}h ${min%60}m`; }
    const corBadge = { 'Atrasado':'bg-red-600','Atenção':'bg-amber-500 text-black','No Prazo':'bg-emerald-600','Concluído':'bg-blue-600' };

    // peças que ENTRARAM no setor i (= saída do setor anterior, ou total no 1º)
    function entradaSetor(op, i){
      if (i <= 0) return op.total || 0;
      const r = op.roteiro || [];
      const antes = (op.historicoTempos||{})[r[i-1]];
      return (antes && typeof antes.qtd === 'number') ? antes.qtd : (op.total || 0);
    }
    function refugoTotal(op){
      const r = op.roteiro || []; let ref = 0;
      for (let i=0;i<r.length;i++){ const h=(op.historicoTempos||{})[r[i]]; if(h && typeof h.qtd==='number') ref += Math.max(0, entradaSetor(op,i)-h.qtd); }
      return ref;
    }

    // ===== PERMISSÕES (controle operacional) =====
    function getPerms(){ try{ return JSON.parse(sessionStorage.getItem('calfer_perms')); }catch(e){ return null; } }
    const PERM_FALLBACK = { apRecuar:'apontamento', apPDF:'apontamento', histExportar:'historico', histBackup:'historico' };
    function podeAcessar(k){ const p=getPerms(); if(!p) return true; if(k in p) return !!p[k]; if(PERM_FALLBACK[k]) return !!p[PERM_FALLBACK[k]]; return false; } // sem perms = legado = acesso total
    function primeiraRota(){
      if(podeAcessar('dashboard')) return 'index.html';
      if(podeAcessar('apontamento')) return 'dados.html';
      if(podeAcessar('ops')||podeAcessar('estrutura')||podeAcessar('operadores')) return 'cadastro.html';
      if(podeAcessar('historico')) return 'historico.html';
      return 'index.html';
    }

    // ===== HEADER UNIFICADO (idêntico nos arquivos) =====
    function Header({ active, user, extra }){
      const sair = () => { sessionStorage.removeItem('calfer_user'); sessionStorage.removeItem('calfer_perms'); window.location.href='index.html'; };
      const Nav = ({href,id,children}) => (
        <a href={href} className={`px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wider transition ${active===id?'bg-blue-600 text-white shadow-lg shadow-blue-600/30':'text-gray-400 hover:text-white hover:bg-gray-800'}`}>{children}</a>
      );
      return (
        <header className="bg-[#0f1523] border border-gray-800 rounded-2xl px-4 py-2.5 flex flex-wrap gap-3 justify-between items-center mb-6">
          <div className="flex items-center gap-4">
            <div className="bg-white p-1.5 rounded-xl shadow"><img src="https://iili.io/CYuzbaV.png" alt="CALFER" className="h-9 object-contain"/></div>
            <div className="border-r border-gray-800 pr-4">
              <h1 className="text-xl font-black text-white leading-none tracking-tight">CONTROLE DE <span className="text-blue-500">OP</span></h1>
              <p className="text-gray-500 text-[9px] font-bold tracking-[0.15em] mt-0.5">CALFER · CALDEIRARIA E FERRAMENTARIA</p>
            </div>
            <nav className="flex gap-1.5">
              {podeAcessar('dashboard') && <Nav href="index.html" id="dashboard">Dashboard</Nav>}
              {podeAcessar('apontamento') && <Nav href="dados.html" id="apontamento">Apontamento</Nav>}
              {(podeAcessar('ops')||podeAcessar('estrutura')||podeAcessar('operadores')) && <Nav href="cadastro.html" id="cadastros">Cadastros</Nav>}
              {podeAcessar('historico') && <Nav href="historico.html" id="historico">Histórico</Nav>}
            </nav>
          </div>
          <div className="flex items-center gap-3">
            {extra}
            {user && <span className="text-xs font-mono text-gray-300 bg-gray-800 px-3 py-1.5 rounded-lg">👤 {user}</span>}
            <button onClick={sair} className="text-xs font-bold text-red-400 bg-red-950/40 border border-red-900 px-3 py-1.5 rounded-lg hover:bg-red-900/40">Sair</button>
          </div>
        </header>
      );
    }

    // ===== CARD (memoizado: só redesenha quando a OP dele muda) =====
    const CardOP = memo(function CardOP({ op, travado, onConcluir, onRecuar, onPDF }){
      const r = op.roteiro || [];
      const idx = op.etapaAtual;
      const setor = r[idx] || 'FIM';
      const ultimo = idx === r.length - 1;
      const h = (op.historicoTempos||{})[setor];
      const refugo = refugoTotal(op);
      return (
        <div className="p-4 rounded-2xl border bg-gray-800 border-gray-700 flex flex-col justify-between shadow">
          <div className="flex justify-between items-start border-b border-gray-700 pb-2">
            <div>
              <h2 className="text-2xl font-bold text-cyan-400 font-mono">{op.id} <span className="text-[10px] text-gray-500">NF: {op.notaFiscal}</span></h2>
              <p className="text-xs text-gray-300 mt-1">{op.cliente} | {op.maquina} | {op.conjunto}</p>
            </div>
            <div className="flex flex-col items-end gap-2">
              <span className={`text-[10px] font-bold px-2 py-1 rounded ${corBadge[op.status]}`}>{op.status}</span>
              {podeAcessar('apPDF') && <button onClick={()=>onPDF(op)} className="bg-gray-900 border border-gray-600 px-2 py-1 rounded text-[10px] text-gray-300 font-bold">🖨️ PDF</button>}
            </div>
          </div>

          <div className="bg-gray-950 p-3 rounded-xl border border-gray-800 my-3">
            <div className="flex items-center justify-between gap-2">
              {podeAcessar('apRecuar')
                ? <button onClick={()=>onRecuar(op)} disabled={idx===0} className="bg-gray-800 text-sm font-bold px-3 py-3 rounded-lg disabled:opacity-20 active:scale-95 transition">← Recuar</button>
                : <span className="w-16"></span>}
              <div className="text-center flex-1">
                <p className="text-[9px] text-gray-500 uppercase font-bold">Setor atual</p>
                <p className="text-lg font-black text-yellow-400 uppercase leading-none">{setor}</p>
              </div>
            </div>
            <button
              onClick={()=>onConcluir(op)}
              disabled={travado}
              className={`w-full mt-3 py-3 rounded-lg font-black text-base uppercase tracking-wide active:scale-95 transition ${travado ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : ultimo ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-blue-600 hover:bg-blue-500'}`}>
              {travado ? '🔒 Selecione seu nome' : ultimo ? '✓ Concluir OP' : `✓ Concluir ${setor} →`}
            </button>
            <div className="text-[9px] text-gray-500 mt-2 border-t border-gray-900 pt-1">Tempo útil neste setor: <span className="text-yellow-500 font-mono">{h?fmtMin(tempoUtilMin(h.inicio,h.fim)):'0m'}</span></div>
          </div>

          <div className="flex justify-between items-center text-xs">
            <div><p className="text-gray-500">Meta</p><p className="font-bold text-gray-300">{op.total} pçs</p></div>
            <div className="text-right"><p className="text-gray-500">Passaram</p><p className="font-bold text-cyan-300">{op.feitas ?? '--'} / {op.total}</p></div>
            {refugo > 0 && <div className="text-right"><p className="text-red-500 font-bold">⚠ Refugo</p><p className="font-black text-red-400">{refugo} pçs</p></div>}
          </div>
        </div>
      );
    });

    function App() {
      const operador = sessionStorage.getItem('calfer_user');
      useEffect(() => { if(!operador){ window.location.href='index.html'; return; } if(!podeAcessar('apontamento')) window.location.href=primeiraRota(); }, []);
      const [ordens, setOrdens] = useState([]);
      const [busca, setBusca] = useState('');
      const [filtroSetor, setFiltroSetor] = useState('');
      const [soMinhas, setSoMinhas] = useState(false);

      useEffect(() => {
        const u1 = db.collection('ordens').onSnapshot(snap => {
          setOrdens(snap.docs.map(doc => { const d = doc.data(); return { ...d, docId: doc.id, status: calcStatus(d) }; }));
        });
        return () => u1();
      }, []);
      const atualizar = (id, campos) => db.collection('ordens').doc(id).update(campos);

      // avanço DIRETO: ao avançar, todas as peças passam OK neste setor (sem perguntar)
      const concluirDireto = useCallback((op) => {
        const r = op.roteiro || []; const i = op.etapaAtual;
        if (i >= r.length) return;
        const atual = r[i]; const prox = r[i+1]; const agora = new Date().toISOString();
        const qtd = entradaSetor(op, i);
        const hist = { ...(op.historicoTempos||{}) };
        if (hist[atual]) { hist[atual].fim = agora; hist[atual].por = operador; hist[atual].qtd = qtd; }
        else hist[atual] = { inicio: agora, fim: agora, por: operador, qtd };
        if (prox) hist[prox] = { inicio: agora, fim: null };
        atualizar(op.id, { etapaAtual: i+1, historicoTempos: hist, feitas: qtd, atualizadoEm: agora, atualizadoPor: operador });
      }, [operador]);

      const retroceder = useCallback((op) => {
        if (op.etapaAtual <= 0) return;
        const r = op.roteiro || []; const atual = r[op.etapaAtual]; const ant = r[op.etapaAtual-1];
        const hist = { ...(op.historicoTempos||{}) };
        if (atual && hist[atual]) delete hist[atual];
        if (ant && hist[ant]) { hist[ant].fim = null; delete hist[ant].qtd; }
        atualizar(op.id, { etapaAtual: op.etapaAtual-1, historicoTempos: hist, feitas: entradaSetor(op, op.etapaAtual-1), atualizadoEm: new Date().toISOString(), atualizadoPor: operador });
      }, []);

      const gerarPDF = useCallback((op) => {
        const r = op.roteiro || []; const j = window.open('', '_blank'); let linhas = '';
        r.forEach((setor,i) => {
          const h = (op.historicoTempos||{})[setor];
          const qtd = h && typeof h.qtd==='number' ? h.qtd : null;
          const ref = qtd!==null ? Math.max(0, entradaSetor(op,i)-qtd) : null;
          linhas += `<tr><td style="padding:8px;border:1px solid #ddd;">${i+1}º ${setor.toUpperCase()}</td><td style="padding:8px;border:1px solid #ddd;">${h?.por||'-'}</td><td style="padding:8px;border:1px solid #ddd;text-align:center;">${qtd!==null?qtd:'-'}</td><td style="padding:8px;border:1px solid #ddd;text-align:center;color:${ref?'#b91c1c':'#333'};">${ref!==null?ref:'-'}</td><td style="padding:8px;border:1px solid #ddd;text-align:right;">${h?fmtMin(tempoUtilMin(h.inicio,h.fim)):'Aguardando'}</td></tr>`;
        });
        j.document.write(`<html><head><title>Relatório ${op.id}</title><style>body{font-family:Arial;margin:40px;}.header{display:flex;justify-content:space-between;border-bottom:2px solid #000;}.box{border:1px solid #bbb;padding:12px;background:#f9f9f9;margin-top:15px;}table{width:100%;border-collapse:collapse;margin-top:15px;}th{background:#333;color:#fff;padding:8px;text-align:left;}</style></head><body><div class="header"><h1>CALFER · Caldeiraria e Ferramentaria</h1><div>Emitido: ${new Date().toLocaleString('pt-BR')}</div></div><h2>OP ${op.id}</h2><div class="box"><strong>Estrutura:</strong> ${op.cliente} | ${op.maquina} | ${op.conjunto}<br><strong>NF:</strong> ${op.notaFiscal} &nbsp; | &nbsp; <strong>Meta:</strong> ${op.total} pçs &nbsp; | &nbsp; <strong>Refugo total:</strong> ${refugoTotal(op)} pçs</div><table><thead><tr><th>SETOR</th><th>OPERADOR</th><th style="text-align:center;">PASSOU</th><th style="text-align:center;">REFUGO</th><th style="text-align:right;">TEMPO ÚTIL</th></tr></thead><tbody>${linhas}</tbody></table><p style="margin-top:12px;font-size:11px;color:#666;">*Tempo útil considera apenas horário de trabalho (${JORNADA.inicio}–${JORNADA.fim}, seg–sex).</p><script>window.onload=function(){window.print();window.close();}<\/script></body></html>`);
        j.document.close();
      }, []);

      const ativas = ordens.filter(o => o.status !== 'Concluído' && o.status !== 'Cancelada');

      // setores que de fato têm OP parada agora (pra montar os chips)
      const setoresComOP = ORDEM_SETORES.filter(s => ativas.some(o => (o.roteiro||[])[o.etapaAtual] === s));

      const b = busca.trim().toLowerCase();
      const listaAndamento = ativas.filter(op => {
        const setorAtual = (op.roteiro||[])[op.etapaAtual];
        if (filtroSetor && setorAtual !== filtroSetor) return false;
        if (soMinhas && operador) { const tocou = Object.values(op.historicoTempos||{}).some(x => x.por === operador); if(!tocou) return false; }
        if (b && !(`${op.id} ${op.cliente}`.toLowerCase().includes(b))) return false;
        return true;
      });

      if (!operador) return null;
      return (
        <div className="max-w-6xl mx-auto pb-10">
          <Header active="apontamento" user={operador}/>

          {/* BUSCA + FILTRO POR SETOR + MINHAS (mobile-first) */}
          <div className="bg-gray-800 p-3 rounded-xl border border-gray-700 mb-4 space-y-3">
            <div className="flex gap-2 items-center">
              <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="\ud83d\udd0e Buscar OP ou cliente" className="flex-1 min-w-0 bg-gray-950 text-base p-3 rounded-lg border border-gray-700"/>
              <button onClick={()=>setSoMinhas(m=>!m)} className={`text-sm font-bold px-4 py-3 rounded-lg border shrink-0 ${soMinhas?'bg-cyan-600 border-cyan-500':'bg-gray-950 border-gray-700 text-gray-300'}`}>\u2b50 Minhas</button>
            </div>
            <div className="flex flex-wrap gap-1.5">
              <button onClick={()=>setFiltroSetor('')} className={`text-xs font-bold px-3 py-2 rounded-full ${filtroSetor===''?'bg-yellow-500 text-black':'bg-gray-950 text-gray-400 border border-gray-700'}`}>Todos ({ativas.length})</button>
              {setoresComOP.map(s=>(
                <button key={s} onClick={()=>setFiltroSetor(s)} className={`text-xs font-bold px-3 py-2 rounded-full ${filtroSetor===s?'bg-yellow-500 text-black':'bg-gray-950 text-gray-400 border border-gray-700'}`}>{s} <span className="opacity-60">{ativas.filter(o=>(o.roteiro||[])[o.etapaAtual]===s).length}</span></button>
              ))}
            </div>
          </div>

          {listaAndamento.length===0 && <div className="text-center text-gray-600 py-10 text-sm">Nenhuma OP com esse filtro.</div>}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {listaAndamento.map(op => (
              <CardOP key={op.id} op={op} travado={!operador} onConcluir={concluirDireto} onRecuar={retroceder} onPDF={gerarPDF} />
            ))}
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
  <!-- ===== PWA: service worker + botão instalar ===== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
    }
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; const b=document.getElementById('pwa-install'); if(b) b.style.display='flex'; });
    window.addEventListener('DOMContentLoaded', () => {
      const btn = document.createElement('button');
      btn.id='pwa-install'; btn.textContent='⬇️ Instalar app';
      btn.style.cssText='display:none;align-items:center;position:fixed;bottom:16px;left:16px;z-index:9999;background:#2563eb;color:#fff;font-weight:800;font-size:12px;padding:10px 14px;border:none;border-radius:12px;box-shadow:0 4px 14px rgba(37,99,235,.4);cursor:pointer;';
      btn.onclick=async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; btn.style.display='none'; };
      document.body.appendChild(btn);
    });
    window.addEventListener('appinstalled', () => { const b=document.getElementById('pwa-install'); if(b) b.style.display='none'; });
  </script>
</body>
</html>
